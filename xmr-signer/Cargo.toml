[workspace]
resolver = "2"
members = ["crates/xmr-gate", "crates/xmr-keys", "crates/libmonero-signer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
authors = ["Angel Castillo <angel.castillob@protonmail.com>"]
repository = "https://github.com/Biglup/monero-seedsigner-research"

[workspace.dependencies]
# monero-oxide default branch, pinned by commit. See REPORT.md for the decision record.
monero-wallet = { git = "https://github.com/monero-oxide/monero-oxide", rev = "731657ae3385be667abb556266369a497bc86f13", default-features = false, features = ["std", "compile-time-generators"] }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "zeroize"] }
zeroize = { version = "1", default-features = false }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
