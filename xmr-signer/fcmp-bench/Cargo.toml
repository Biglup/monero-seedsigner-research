# Separate workspace on purpose: it pins monero-oxide's fcmp++ branch, which
# would clash with the main workspace's pin of the default branch.
[workspace]

[package]
name = "fcmp-bench"
description = "Cost of the FCMP++ spend-authorization-and-linkability proof (the cold side's job after the fork) on ARMv6"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
monero-fcmp-plus-plus = { git = "https://github.com/monero-oxide/monero-oxide", rev = "31c26d96eaadbba910ffe3613ad8b4cf9c598a93" }
dalek-ff-group = "0.5"
monero-ed25519 = { git = "https://github.com/monero-oxide/monero-oxide", rev = "31c26d96eaadbba910ffe3613ad8b4cf9c598a93" }
ciphersuite = { version = "0.4", default-features = false }
rand_core = { version = "0.6", features = ["getrandom"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
