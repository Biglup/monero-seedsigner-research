[package]
name = "libmonero-signer"
description = "Stateless Monero cold signer core: wallet2 cold-signing payloads in, key images and signed txs out"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
monero-wallet.workspace = true
curve25519-dalek = { workspace = true, features = ["rand_core"] }
zeroize.workspace = true
xmr-keys = { path = "../xmr-keys" }
sha3 = { version = "0.10", default-features = false }
chacha20 = { version = "0.9", default-features = false }
cuprate-cryptonight = { git = "https://github.com/Cuprate/cuprate", rev = "4f8fcd1bf468f566fcd89c460d50de4adb6825bf" }
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = { version = "2", default-features = false }
thiserror = "2"

[dev-dependencies]
hex = "0.4"
serde_json = "1"
